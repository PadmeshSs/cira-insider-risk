[alembic]
script_location = %(here)s/alembic

prepend_sys_path = .

# Split path lists with os.pathsep (Alembic >= 1.16). Without it Alembic warns and falls
# back to splitting on spaces, commas and colons; a colon split would cut a Windows drive letter.
path_separator = os

sqlalchemy.url = postgresql+asyncpg://placeholder:placeholder@localhost:5432/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s